<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <style></style>
</head>

<body>
<h2>회원가입</h2>
<form th:action="@{/signup}" th:object="${user}" method="post">
    <div><label>아이디: <input type="text" th:field="*{username}" /></label></div>
    <div><label>비밀번호: <input type="password" th:field="*{password}" /></label></div>
    <div><button type="submit">가입하기</button></div>
</form>
<p>이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a></p>

</body>
</html>
