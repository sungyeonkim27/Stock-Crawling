<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 — StockBoard</title>
    <link rel="stylesheet" th:href="@{/css/login_signup.css}" />
</head>

<body class="auth-container">

<div class="auth-box">
    <div class="auth-brand">📈 StockBoard</div>
    <h2>로그인</h2>

    <div th:if="${errorMessage}" class="error-message">
        <span th:text="${errorMessage}"></span>
    </div>

    <div th:if="${logoutMessage}" class="success-message">
        <span th:text="${logoutMessage}"></span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>아이디</label>
            <input type="text" name="username" placeholder="아이디를 입력하세요" required />
        </div>
        <div class="form-group">
            <label>비밀번호</label>
            <input type="password" name="password" placeholder="비밀번호를 입력하세요" required />
        </div>
        <button type="submit" class="btn-primary">로그인</button>
    </form>

    <hr class="auth-divider" />

    <a th:href="@{/}" class="btn-guest">홈페이지로 이동</a>

</div>

</body>
</html>
