<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" th:href="@{/css/login_signup.css}" />
</head>

<body class="auth-container">

<div class="auth-box">
    <h2>🔐 로그인</h2>

    <div th:if="${errorMessage}" class="error-message">
        <span th:text="${errorMessage}"></span>
    </div>

    <div th:if="${logoutMessage}" class="success-message">
        <span th:text="$logoutMessage}"></span>
    </div>
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>아이디</label>
            <input type="text" name="username" required />
        </div>
        <div class="form-group">
            <label>비밀번호</label>
            <input type="password" name="password" required />
        </div>

        <button type="submit" class="btn-primary">로그인</button>
    </form>

    <p class="footer-text">
        계정이 없으신가요? <a th:href="@{/signup}">회원가입</a>
    </p>

    <form th:action="@{/login}" method="POST" id="fakeUserForm">
        <input type="hidden" name="username" value="FAKEUSER" />
        <input type="hidden" name="password" value="FAKEUSER1" />
        <button type="submit" class="btn-guest">회원가입 없이 임시 로그인</button>
    </form>
</div>

</body>
</html>
