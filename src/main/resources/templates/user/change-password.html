<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경 — StockBoard</title>
    <link rel="stylesheet" th:href="@{/css/login_signup.css}" />
</head>

<body class="auth-container">

<div class="auth-box">
    <div class="auth-brand">📈 StockBoard</div>
    <h2>비밀번호 변경</h2>

    <div th:if="${successMessage}" class="success-message">
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${errorMessage}" class="error-message">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="requirements-box">
        <h3>새 비밀번호 조건</h3>
        <ul>
            <li>8자 이상 20자 이하</li>
            <li>숫자 1개 이상 포함</li>
            <li>현재 비밀번호와 달라야 함</li>
            <li>비밀번호 확인과 일치해야 함</li>
        </ul>
    </div>

    <form th:action="@{/change-password}" method="post">
        <div class="form-group">
            <label>현재 비밀번호</label>
            <input type="password" name="currentPassword" placeholder="현재 비밀번호 입력" required id="currentPassword" />
        </div>
        <div id="currentPassword-message" class="validation-message"></div>

        <div class="form-group">
            <label>새 비밀번호</label>
            <input type="password" name="newPassword" placeholder="새 비밀번호 입력 (8~20자, 숫자 포함)" required id="newPassword" />
        </div>
        <div id="newPassword-message" class="validation-message"></div>

        <div class="form-group">
            <label>새 비밀번호 확인</label>
            <input type="password" name="newPasswordConfirm" placeholder="새 비밀번호 재입력" required id="newPasswordConfirm" />
        </div>
        <div id="newPasswordConfirm-message" class="validation-message"></div>

        <button type="submit" class="btn-primary">비밀번호 변경</button>
    </form>

    <p class="footer-text">
        <a th:href="@{/}">← 메인으로 돌아가기</a>
    </p>
</div>

<script th:src="@{/script/signup-validation-change-password.js}"></script>
</body>
</html>
