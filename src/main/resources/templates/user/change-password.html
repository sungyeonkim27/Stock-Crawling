<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>
    <link rel="stylesheet" th:href="@{/css/login_signup.css}" />
</head>

<body class="auth-container">

<div class="auth-box">
    <h2>비밀번호 변경</h2>

    <div th:if="${successMessage}" class="success-message">
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${errorMessage}" class="error-message">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="requirements-box">
        <h3>새 비밀번호 제한사항</h3>
        <ul>
            <li>비밀번호: 8자 이상 20자 이하로 입력해주세요</li>
            <li>비밀번호: 숫자를 1개 이상 포함해야 합니다</li>
            <li>새 비밀번호: 현재 비밀번호와 달라야 합니다</li>
            <li>비밀번호 확인: 새 비밀번호와 일치해야 합니다</li>
        </ul>
    </div>

    <form th:action="@{/change-password}" method="post">
        <div class="form-group">
            <label>현재 비밀번호</label>
            <input type="password" name="currentPassword" required id="currentPassword"/>
        </div>
        <div id="currentPassword-message" class="validation-message"></div>

        <div class="form-group">
            <label>새 비밀번호</label>
            <input type="password" name="newPassword" required id="newPassword"/>
        </div>
        <div id="newPassword-message" class="validation-message"></div>


        <div class="form-group">
            <label>새 비밀번호 확인</label>
            <input type="password" name="newPasswordConfirm" required id="newPasswordConfirm"/>
        </div>
        <div id="newPasswordConfirm-message" class="validation-message"></div>

        <button type="submit" class="btn-primary">비밀번호 변경</button>
    </form>

    <p class="footer-text">
        <a th:href="@{/}">메인으로 돌아가기</a>
    </p>
</div>

<script th:src="@{/script/signup-validation-change-password.js}"></script>
</body>
</html>
