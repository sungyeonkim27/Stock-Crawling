<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" th:href="@{/css/login_signup.css}" />
</head>

<body class="auth-container">

<div class="auth-box">
    <h2>📝 회원가입</h2>

    <div th:if="${errorMessage}" class="error-message">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="requirements-box">
        <h3>💡 회원가입 제한사항</h3>
        <ul>
            <li>아이디: 6자 이상 30자 이하로 입력해주세요</li>
            <li>아이디: 중복된 아이디는 사용할 수 없습니다</li>
            <li>비밀번호: 8자 이상 20자 이하로 입력해주세요</li>
            <li>비밀번호: 숫자를 1개 이상 포함해야 합니다</li>
            <li>비밀번호 확인: 비밀번호와 일치해야 합니다</li>
        </ul>
    </div>

    <form th:action="@{/signup}" th:object="${user}" method="post">
        <div class="form-group">
            <label>아이디</label>
            <input type="text" th:field="*{username}" required />
        </div>

        <div class="form-group">
            <label>비밀번호</label>
            <input type="password" th:field="*{password}" required />
        </div>

        <div class="form-group">
            <label>비밀번호 확인</label>
            <input type="password" name="passwordConfirm" required />
        </div>

        <button type="submit" class="btn-primary">가입하기</button>
    </form>

    <p class="footer-text">
        이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a>
    </p>
</div>

</body>
</html>
