<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>StockBoard</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">📈 StockBoard</div>

        <div class="sidebar-section">
            <div class="sidebar-section-title">관심 종목</div>
            <input type="text" id="watchlist-stockCode" placeholder="종목 코드 (예: 005930)" />
            <button class="btn-secondary" onclick="fetchWatchlist()">목록 조회</button>
            <button class="btn-primary" onclick="addWatchlist()">종목 추가</button>
            <div id="watchlist-container"></div>
        </div>

        <div class="sidebar-footer">
            <!-- 로그인 사용자 -->
            <div sec:authorize="isAuthenticated()">
                <div class="user-info">
                    👤 <span sec:authentication="name"></span>
                </div>
                <a th:href="@{/change-password}" class="btn-change-password">비밀번호 변경</a>
                <form th:action="@{/logout}" method="POST">
                    <button type="submit" class="btn-logout">로그아웃</button>
                </form>
            </div>

            <!-- 게스트 -->
            <div sec:authorize="!isAuthenticated()">
                <div class="user-info">👤 <span>게스트</span></div>
                <a th:href="@{/login}" class="btn-login">로그인</a>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <!-- 종목 탭 바 -->
        <div class="stock-tab-bar" id="stockTabBar">
            <span class="tab-empty">관심 종목을 추가하면 탭이 생성됩니다.</span>
        </div>

        <!-- 종목 데이터 영역 -->
        <div class="stock-page" id="stockPage">
            <div class="stock-page-empty">종목 탭을 선택하면 차트와 데이터를 확인할 수 있습니다.</div>
        </div>

    </main>
</div>

<script src="/script/main.js"></script>
</body>
</html>
