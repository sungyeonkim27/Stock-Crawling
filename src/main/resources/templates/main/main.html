<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>📊 Stock Crawling Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>

<body>

<div th:replace="~{common/header :: siteHeader}"></div>

<main class="container">

    <section class="section">
        <h2>📥 데이터 크롤링</h2>
        <button class="btn btn-primary" onclick="loadStocks()">📈 주가 크롤링</button>
        <button class="btn btn-primary" onclick="loadMarket()">💹 코스피 & 뉴스 크롤링</button>
    </section>

    <section class="section">
        <h2>📂 데이터 조회</h2>
        <button class="btn btn-secondary" onclick="fetchStocks()">🗂 저장된 주가 조회</button>
        <button class="btn btn-secondary" onclick="fetchMarket()">📰 저장된 코스피 & 뉴스 조회</button>
    </section>

    <section class="section">
        <h2>🧹 데이터 삭제 (관리자)</h2>
        <div class="delete-row">
            <input type="text" id="deleteCode" class="input" placeholder="삭제할 종목 코드 입력" />
            <button class="btn btn-danger" onclick="deleteStocks()">❌ 주가 삭제(관리자만 가능)</button>
            <button class="btn btn-danger" onclick="deleteMarketData()">❌ 코스피 & 뉴스 삭제(관리자만 가능)</button>
        </div>
    </section>

    <section class="section">
        <h2>🔎 검색 기능</h2>
        <div class="search-row">
            <input type="text" id="searchKeyword" class="input" placeholder="종목명 또는 코드 검색" />
            <button class="btn btn-primary" onclick="searchStocks()">🔍 주식 검색</button>
            <button class="btn btn-primary" onclick="searchMarketNews()">🔍 뉴스 검색</button>
        </div>
    </section>

    <section class="section">
        <div id="dataContainer" class="data-box">데이터를 불러오려면 버튼을 클릭하세요.</div>
    </section>

</main>

<script src="/script/main.js"></script>
</body>
</html>
