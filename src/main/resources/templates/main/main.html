<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>📊 Stock Crawling Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>

<body>

<div th:replace="~{common/header :: siteHeader}"></div>

<main class="layout">
    <div class="panel-left">
        <section class="card">
            <h3>
                <span sec:authentication="principal.username">사용자 이름</span> 님 관심 종목
            </h3>
            <div class="btn-group">
                <input type="text" id="watchlist-stockCode" placeholder="종목 코드 입력">
                <button class="btn-primary" onclick="fetchWatchlist()">관심 종목 불러오기</button>
                <button class="btn-primary" onclick="addWatchlist()">관심 종목 추가하기</button>
            </div>
            <div id="watchlist-container">관심 종목 리스트</div>
        </section>
    </div>
    <!-- 왼쪽: 기능 카드 영역 -->
    <div class="panel-middle">
        <section class="card">
            <h3>📥 데이터 크롤링</h3>
            <div class="btn-group">
                <button class="btn-primary" onclick="loadStocks()">📈 주가 크롤링</button>
                <button class="btn-primary" onclick="loadMarket()">💹 코스피 & 뉴스 크롤링</button>
            </div>
        </section>

        <section class="card">
            <h3>📂 데이터 조회</h3>
            <div class="btn-group">
                <button class="btn-secondary" onclick="fetchStocks()">🗂 저장된 주가 조회</button>
                <button class="btn-secondary" onclick="fetchMarket()">📰 저장된 코스피 & 뉴스 조회</button>
            </div>
        </section>

        <section class="card">
            <h3>🧹 데이터 삭제</h3>
            <div class="input-group">
                <input type="text" id="deleteCode" placeholder="종목 코드 입력" />
                <button class="btn-danger" onclick="deleteStocks()">❌ 주가 삭제</button>
                <button class="btn-danger" onclick="deleteMarketData()">❌ 코스피 & 뉴스 삭제</button>
            </div>
        </section>

        <section class="card">
            <h3>🔎 검색 기능</h3>
            <div class="input-group">
                <input type="text" id="searchKeyword" placeholder="종목명 또는 코드 검색" />
                <button class="btn-primary" onclick="searchStocks()">🔍 주식 검색</button>
                <button class="btn-primary" onclick="searchMarketNews()">🔍 뉴스 검색</button>
            </div>
        </section>
    </div>

    <!-- 오른쪽: 출력 영역 -->
    <div class="panel-right">
        <section class="card result-card">
            <h3>
                <span sec:authentication="principal.username">사용자 이름</span> 님의 관심 주식
            </h3>
            <div id="dataContainer" class="result-box">
                데이터를 불러오려면 버튼을 클릭하세요.
            </div>
        </section>
    </div>
</main>


<script src="/script/main.js"></script>
</body>
</html>
