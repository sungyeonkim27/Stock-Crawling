name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script_stop: false   # 🔥 이 줄 추가
          script: |
            echo "📦 배포 시작..."
            cd /root/seongyeon/Stock-Crawling

            echo "🛠 Java 설치 여부 확인"
            if ! command -v java &> /dev/null
            then
              echo "🚨 Java 미설치 → OpenJDK 설치 진행"
              sudo apt update && sudo apt install -y openjdk-17-jdk
            fi

            echo "📌 최신 코드 가져오기"
            git fetch --all
            git reset --hard origin/main
            git pull origin main

            echo "🔨 Maven 빌드 시작"
            mvn clean package -DskipTests

            echo "🛑 기존 애플리케이션 중지-"
            pkill -f crawling-0.0.1-SNAPSHOT.jar || echo "⚠ 기존 프로세스 없음"

            echo "🚀 새 버전 실행 (세션 분리)"
            setsid nohup java -jar target/crawling-0.0.1-SNAPSHOT.jar --server.port=6100 > app.log 2>&1 < /dev/null &
            sleep 5
            
            echo "📡 실행 확인"
            ps -ef | grep crawling
            
            echo "📄 최근 로그 출력"
            tail -n 30 app.log
  
            echo "🎉 배포 완료!"
