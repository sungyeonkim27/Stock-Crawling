name: Deploy to Server

on:
  push:
    branches:
      - main   # main 브랜치에 push될 때만 실행

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "📦 배포 시작..."
            cd /root/seongyeon/Stock-Crawling
            
            echo "📌 최신 코드 가져오기"
            git fetch --all
            git reset --hard origin/main
            git pull origin main

            echo "🔨 Maven 빌드 시작"
            mvn clean package -DskipTests

            echo "🛑 기존 애플리케이션 중지"
            pkill -f crawling-0.0.1-SNAPSHOT.jar || echo "No process to kill"

            echo "🚀 새 버전 실행"
            nohup java -jar target/crawling-0.0.1-SNAPSHOT.jar > app.log 2>&1 &

            echo "🎉 배포 완료!"
